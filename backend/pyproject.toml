[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HaeengIn", email = "haeengin@gmail.com" }
]
requires-python = ">=3.12.1"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.142.2",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
